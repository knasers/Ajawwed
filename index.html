<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0">
  <title>Game قيم</title>

  <!-- Custom Font -->
  <style>
    @font-face {
      font-family: "CustomFont";
      src: url('Asset/fonts/lbc-regular-.otf') format('opentype');
    }

    /* Apply the custom font to the whole document */
    body {
      font-family: "CustomFont", sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      /* Default background color */
    }
  </style>

  <!-- Phaser Library -->
  <script src="//cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/RecordRTC/5.6.2/RecordRTC.min.js"></script>

  <script src="phaser-arcade-physics.min.js"></script>


  <!-- Game JavaScript Files -->
  <script src="loading.js"></script> <!-- Loading scene is included first -->
  <script src="Story.js"></script>
  <script src="Game.js"></script>
  <script src="Level2.js"></script>
  <script src="Level3.js"></script>
  <script src="Level4.js"></script>
  <script src="Menu.js"></script>
  <script src="Credit.js"></script>
  <script src="Win.js"></script>
  <script src="GameOver.js"></script>
  <script src="config.js"></script>
  <script src="showRandomQuestion.js"></script>
  <script src="collectCoin.js"></script>
  <script src="CollectMoney.js"></script>
  <script src="handleHit.js"></script>
 // <script src="visitorCounter.js"></script>




  <!-- Phaser Game Initialization -->
  <script>
    window.onload = function () {
      const game = new Phaser.Game(phaserConfig);
      game.scene.start("Loading"); // Start the Loading scene initially
    };
  </script>
</head>

<body>
  <div id="game"></div> <!-- This will be the container for the Phaser game -->

  <!-- Invisible element to ensure the custom font is loaded -->
  <div style="font-family:CustomFont; position: absolute; left:-1000px; visibility:hidden;">.</div>
</body>

</html>
